controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    finger_position_controller:
      type: position_controllers/JointGroupPositionController

finger_position_controller:
  ros__parameters:
    joints:
      # Thumb
      - r_thumb1_joint
      - r_thumb_joint
      - r_thumb3_joint
      # Index
      - r_index1_joint
      - r_index_joint
      - r_index3_joint
      # Middle
      - r_middle1_joint
      - r_middle_joint
      - r_middle3_joint
      # Ring
      - r_ring1_joint
      - r_ring_joint
      - r_ring3_joint
      - r_ring4_joint
      # Pinky
      - r_pinky1_joint
      - r_pinky_joint
      - r_pinky3_joint
      - r_pinky4_joint
